# ----------------------------------------------------------------------
# Model architecture config — AR-DiT-Cond-XL/2 on CIFAR-10 (pixel space).
#
# This is the drop-in E1 (time-conditioned pseudo-query) counterpart of
# ``ar_dit_xl2_cifar.yaml``. Every dataset-facing field (input_size /
# in_channels / patch_size / num_classes / class_dropout_prob) is
# identical to both the baseline DiT config and the paper-strict
# AR-DiT-XL/2 config; only ``arch_name`` differs. That is intentional —
# the E1 ablation is a same-shape same-compute swap of the pseudo-query
# construction (constant ``w_l`` → time-conditioned ``w_l(t)``), so
# the fair comparison is with everything else held equal.
#
# See doc/AR_DiT.md §9a for the E1 architecture spec, doc/AR_DiT.md
# §§1-8 for the paper-strict AR-DiT baseline, and doc/DiT.md for the
# meaning of each field below.
# ----------------------------------------------------------------------

arch_name: ARDiTCond_XL_2   # one of: ARDiTCond_S_2, ARDiTCond_B_2, ARDiTCond_L_2, ARDiTCond_XL_2
                            # (selects (depth, hidden_size, num_heads); the
                            # remaining fields below are independent of the
                            # preset and override the preset's defaults.)

input_size: 32              # H = W
in_channels: 3              # CIFAR-10 RGB; pixel space (no VAE).
patch_size: 2               # PatchEmbed kernel/stride. 32 / 2 = 16x16 = 256 tokens.

num_classes: 10             # CIFAR-10 has 10 classes; +1 null slot is added
                            # internally by LabelEmbedder for CFG.

class_dropout_prob: 0.1     # CFG label-dropout probability during training.
                            # See doc/FlowMatching.md §4.1.
