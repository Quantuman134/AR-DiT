# ----------------------------------------------------------------------
# Model architecture config — AR-DiT-Cond-SANA-XL/2 on CIFAR-10 (pixel space).
#
# This is the drop-in E2 (SANA-time-conditioned pseudo-query) counterpart
# of ``ar_dit_xl2_cifar.yaml`` and ``ar_dit_cond_xl2_cifar.yaml``. Every
# dataset-facing field (input_size / in_channels / patch_size /
# num_classes / class_dropout_prob) is identical to those siblings; only
# ``arch_name`` and the new ``num_time_bins`` field differ. That is
# intentional — the E2 ablation is a same-shape, same-compute swap of
# the pseudo-query construction (constant ``w_l`` → depth-shared,
# time-codebook-based ``q_m(t)``), so the fair comparison is with
# everything else held equal.
#
# See doc/AR_DiT.md §9b for the E2 architecture spec, §9a for the E1
# baseline it contrasts with, §§1-8 for the paper-strict AR-DiT
# baseline, and doc/DiT.md for the meaning of each field below.
# ----------------------------------------------------------------------

arch_name: ARDiTCondSANA_XL_2  # one of: ARDiTCondSANA_S_2, ARDiTCondSANA_B_2, ARDiTCondSANA_L_2, ARDiTCondSANA_XL_2
                               # (selects (depth, hidden_size, num_heads); the
                               # remaining fields below are independent of the
                               # preset and override the preset's defaults.)

input_size: 32              # H = W
in_channels: 3              # CIFAR-10 RGB; pixel space (no VAE).
patch_size: 2               # PatchEmbed kernel/stride. 32 / 2 = 16x16 = 256 tokens.

num_classes: 10             # CIFAR-10 has 10 classes; +1 null slot is added
                            # internally by LabelEmbedder for CFG.

class_dropout_prob: 0.1     # CFG label-dropout probability during training.
                            # See doc/FlowMatching.md §4.1.

# ---- E2-specific ----
# Number of discrete slots in the SANA time codebook (``phi_attn`` /
# ``phi_mlp``). Continuous ``t \in [0, 1]`` is floor-quantised into
# ``num_time_bins`` bins; each bin has its own learnable D-vector per
# junction kind. Default 50 matches the standard flow-matching Euler
# sampler with ``num_steps: 50`` (see the training config), so at
# inference every sampler step queries its own dedicated codebook
# row. See doc/AR_DiT.md §9b.1.
num_time_bins: 50
